# dsh-memory — 长期记忆（存储检索 + 压缩前整理 + 夜间睡觉）
# 2026-10-29：加中午一次整理，凌晨 04:30 不动；2026-10-30 中午那次从 11:00 挪到 13:00；
# 2026-11-11 提前到 12:30（13:00 那轮要跑 60 分钟，14:00 才收尾，提前半小时留余量）
# 2026-11-15：清掉 Config schema 里已经不存在的键（maxChanges / archiveMaxChanges /
# sleepMemoryChars / cooldownMinutes / addPassChars / clusterMaxSize / clusterChanges /
# organizeMaxCalls / sleepSplitLimit / conflictCheckMaxCalls / pipeline.ingestBudget /
# pipeline.replayBudget）。这些键代码早就不读了，留着只会让人以为还能配。
# 备份：/tmp/cordis.patch.yml.bak-t-mwh9eqm9-20261115
- insert:
    - id: memory
      name: 'dsh-memory'
      config:
        # 2026-11-06 13:05 曾为 kmeans 分簇把定时睡觉整体关掉（05:00 和 12:30 两档一起停，
        # 当时 lib/sleep.js:2491 的 setInterval 每分钟看一眼 cfg.sleepEnabled，
        # false 就直接 return，ingest/merge/split 一段都不跑）。
        # 现已恢复 true；2026-11-12 核对，下面这行是 true，睡觉照常跑，本条只作历史记录。
        # 以后真要临时关，把下一行改成 false 再重启 dsh——配置只在进程启动时读。
        sleepEnabled: true
        apiUrl: http://127.0.0.1:8080
        storePath: ./memory
        # 2026-10-29 拆分成原子条目后条数会翻几倍，召回放宽到 8
        topK: 8
        minScore: 0.45
        relativeGap: 0.1
        # 2026-11-13：实体通道权重。实体匹配容易撞上但精度不够，
        # 从写死的 1 降到 0.65；语义 1 / 关键词 0.9 / 时间 0.8|0.4 都没动。代码默认也是 0.65。
        rankWeightEntity: 0.65
        # 2026-11-13：单次召回注入超时。实测 p50 595ms / p90 761ms，
        # 旧默认 800ms 贴着 p90，慢一下就把这次注入白丢。代码默认已改成 1200。
        autoPrefillTimeoutMs: 1200
        provider: magpie
        model: 'group/ds'
        # 2026-11-13：65000 太贴压缩点，51 分 24 秒整理了 3 次（10:28:58 /
        # 11:12:54 / 11:19:05），第 3 轮 11:19:05 起跑、11:19:47 主会话就压缩了，整理直接跑进压缩里。
        # 提到 70000：estimateTokens 是 chars/2（比真实 token 略低，实测 chars/token≈1.80），
        # 70000 估算 ≈ 77700 真实 token，仍落在 83886 压缩点之前，留出 70-80 秒的整理余量；
        # 70000×2=140000 字符是进闸门槛。代码默认是 180000，本机单独压到 7 万。
        # （历史：2026-11-13 曾把 180000 降到 65000，理由是原线高于实际压缩点、
        # consolidate 够不着；降得贴着压缩点，才有了上面这轮过频。）
        triggerTokens: 70000
        growthTokens: 40000
        # 2026-11-13：压缩前整理只对主会话做。true = 只对主会话；
        # 起因是收到「在插件目录新增 1 条」——那是 subagent 会话自己过了
        # triggerTokens 触发的。subagent 会话一律不整理、不推通知；
        # 手动工具 memory_consolidate 不受这个开关限制。改成 false 才恢复旧行为。
        consolidateOnlyMain: true
        # 一天整理两次：05:00 + 12:30。都必须排在会话索引（04:30 / 12:00，各带 10 分钟
        # 随机延迟）之后——2026-10-30 确定的顺序。2026-11-11 中午档 13:00 → 12:30
        schedule:
          - hour: 5
            minute: 0
          - hour: 12
            minute: 30
        # 2026-10-29 去重改成「先聚类、再按 token 预算切批喂模型」：
        # 余弦 ≥0.9 必进同批；批大小不再按条数写死（clusterMaxSize/mergeBatchMax 已删）。
        clusterNearDup: 0.9
        # 批内最像的两条低于这个余弦，就认定这批没重复，不调模型
        clusterQuestionMin: 0.78
        # 2026-10-29 把单条记忆放宽到 200 字：拆的门槛 200，拆出来的单条上限 220
        # 2026-11-03 统一到 200：splitItemMaxChars 从 220 收到 200，跟拆的门槛一致
        splitMaxChars: 200
        splitItemMaxChars: 200
        # 2026-10-29 拆分挂进睡觉流程；单轮条数上限已删（队列里有活就继续领）
        sleepSplitEnabled: true
        # 2026-10-29 入口冲突检查：新记忆入库前跟同实体旧条比一次（不再设条数上限）
        conflictCheckEnabled: true
        # 2026-10-30 决定不汇报睡醒汇总，关掉（失败仍会推）
        sleepSummaryNotify: false
        # 2026-11-05 第二步：会话入库改按文件 ack（ingest_files + pending_ops 重放）。
        # 默认关，关着时 sleep 入库段走老路径，行为不变。
        # 打开前先跑 scripts/apply-pipeline-schema.mjs 建表，否则自动回退老路径。
        # 2026-11-05 t-enable-flags：运行时打开三个开关；lib/index.js 的默认值仍全 false，
        # 回滚只需把下面三个 true 改回 false，不用动代码。表已存在（ingest_files/pending_ops/discards）。
        # 2026-11-14 起 pool 模式下 ingest 一律按文件 ack、curate 固定走 MergeAgent，
        # 单轮文件预算（ingestBudget）与重放预算（replayBudget）已删，该处理的全处理。
        pipeline:
          ingestAck: true
          # 2026-11-05 第三步：唯一写入闸（DedupeAgent）。关着时 save/update/merge
          # 行为与旧版逐字节一致；表已建（discards/pending_ops 存在，均为 0 行）。
          writeGate: true
          writeGateThreshold: 0.9
          # 2026-11-05 第四步：分簇整理走 MergeAgent（双通道 JSON + 证据校验）。
          # 打开后空动作/解析失败落 pending_ops(kind='merge_batch')，第 3 次 dead。
          agentPipeline: true
